version: '3.0'

services:
  # --- Layanan Database untuk Seafile ---
  db:
    image: mariadb:10.11
    container_name: seafile-db
    environment:
      # Ganti password ini dengan password yang kuat dan unik
      - MARIADB_ROOT_PASSWORD=ganti_dengan_password_root_yang_kuat
      - MARIADB_USER=seafile
      - MARIADB_PASSWORD=ganti_dengan_password_seafile_yang_kuat # <== KUNCI 1: PASSWORD INI
      - MARIADB_DATABASE=seafile_db
    volumes:
      - db_data:/var/lib/mysql
      # Mount file konfigurasi custom untuk menaikkan max_allowed_packet
      - ./seafile-data/conf/custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      - sso-net
    # Healthcheck untuk memastikan database benar-benar siap sebelum Seafile dimulai
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MARIADB_ROOT_PASSWORD}"]
      timeout: 20s
      retries: 10

  # --- Layanan Seafile ---
  seafile:
    image: seafileltd/seafile-mc:latest
    container_name: seafile
    ports:
      - "8008:80"
    volumes:
      - ./seafile-data:/shared
    environment:
      - DB_HOST=db
      - DB_USER_NAME=seafile
      - DB_USER_PASSWD=ganti_dengan_password_seafile_yang_kuat # <== KUNCI 2: HARUS SAMA PERSIS DENGAN DI ATAS
      - DB_ROOT_PASSWD=ganti_dengan_password_root_yang_kuat
      - DB_NAME=seafile_db
      - SEAFILE_SERVER_LETSENCRYPT=false
      - SEAFILE_SERVER_HOSTNAME=sso.app # Hostname yang valid untuk setup Seafile
      - TIME_ZONE=Asia/Jakarta
    # Menunggu sampai healthcheck database mengembalikan status "healthy"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sso-net

  # --- Layanan Nginx Reverse Proxy ---
  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - seafile
    networks:
      - sso-net
    extra_hosts:
      # Mengizinkan Nginx di Docker untuk berkomunikasi dengan aplikasi di luar Docker
      - "host.docker.internal:host-gateway"

# --- Definisi Jaringan dan Volume ---
networks:
  sso-net:
    driver: bridge

volumes:
  db_data: