events {
    worker_connections 1024;
}

http {
    # Definisi upstream untuk layanan kita
    upstream node_app {
        # 'host.docker.internal' adalah nama DNS khusus yang merujuk ke mesin host dari dalam kontainer Docker.
        server host.docker.internal:3000;
    }

    upstream seafile_server {
        # 'seafile' adalah nama service dari docker-compose.yml
        server seafile:8000;
    }

    upstream seafile_fileserver {
        server seafile:8082;
    }


    server {
        listen 80;
        server_name localhost;

        # 1. Endpoint untuk validasi auth (internal)
        location = /auth/seafile {
            internal; # Hanya bisa diakses oleh Nginx sendiri
            proxy_pass http://node_app/auth/seafile;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 2. Routing untuk Seafile
        location /seafile {
            # INI BAGIAN UTAMA SSO
            auth_request /auth/seafile;

            # Ambil header 'X-Remote-User' dari response auth_request
            # dan simpan di variabel $auth_user
            auth_request_set $auth_user $upstream_http_x_remote_user;

            # Set header REMOTE_USER yang akan dikirim ke Seafile
            proxy_set_header REMOTE_USER $auth_user;

            # Proxy pass ke Seafile
            proxy_pass http://seafile_server;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 3. Routing untuk file Seafile
        location /seafhttp {
             rewrite ^/seafhttp(.*)$ $1 break;
             proxy_pass http://seafile_fileserver;
             proxy_set_header Host $host;
             client_max_body_size 0;
        }

        # 4. Routing untuk API backend Anda
        location /api/ {
            proxy_pass http://node_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 5. Routing untuk frontend SvelteKit (diasumsikan sudah di-build)
        # Karena frontend Anda berjalan via 'npm run dev', kita proxy ke sana juga.
        location / {
             proxy_pass http://host.docker.internal:5173; # Port dev SvelteKit
             proxy_set_header Upgrade $http_upgrade;
             proxy_set_header Connection "Upgrade";
             proxy_set_header Host $host;
        }
    }
}